<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка</title>
</head>
<style>
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: #000;
    text-align: center;
    align-items: center;
    background-image: url("bg.png");
}

input {
    width: 85%;
    max-width: 400px;
    padding: 14px 18px;
    margin: 20px 0;
    font-size: 13px;
    border-radius: 6px;
    background: #000000;
    color: #ffffff;
    border: 1px solid #ffffff;
    transition: all 0.25s ease-in-out;
    box-sizing: border-box;
    outline: none;
}
input:focus {
    border-color: #ffffff;
}
input::placeholder {
    color: #ffffff;
    transition: opacity 0.2s;
}
input:focus::placeholder {
    opacity: 0.5;
}

.logo {
    width: 55%;
    margin-bottom: 30px;
    margin-top: 30px;
}

p {
    color: #ffffff;
    font-size: 16px;
    margin: 0px 10px;
}
</style>
<body>
<img src="logo.png" class="logo">
<p>Чтобы войти в группу, введите ниже свой ник из among us</p>
<input type="text" id="guardInput" placeholder="Нажмите" autocomplete="off" maxlength="16" inputmode="text">
</body>
<script src="tg-js.js"></script>
<script>
var tg = Telegram.WebApp;
tg.expand();

const mainButton = tg.MainButton;
tg.setHeaderColor("#000");
tg.setBottomBarColor("#000000");
mainButton.setText("Продолжить");
mainButton.color = "#FFFFFF";
mainButton.textColor = "#000000";

const hashString = window.location.hash.substring(1) || "";
const hashParams = hashString.split('_');
const queryId = hashParams[0] || "no_query_id";
const chatId = hashParams[1] || "";

mainButton.show();

/** Латиница + кириллица + цифры; 1-й символ Upper, остальные lower; ≤16 */
function normalizeTagNick(raw) {
    var s = String(raw || "");
    try { s = s.normalize("NFKC"); } catch (e) {}
    s = s.replace(/[\uFE0E\uFE0F\u200B-\u200D\u2060\uFEFF]/g, "");
    s = s.replace(/[^a-zA-Zа-яА-ЯёЁ0-9]/g, "");
    if (!s) return "";
    var chars = Array.from(s).slice(0, 16);
    return chars.map(function (ch, i) {
        return i === 0 ? ch.toLocaleUpperCase("ru-RU") : ch.toLocaleLowerCase("ru-RU");
    }).join("");
}

var inputField = document.getElementById("guardInput");

function applyNickFormat() {
    var start = inputField.selectionStart;
    var end = inputField.selectionEnd;
    var before = inputField.value;
    var next = normalizeTagNick(before);
    if (next === before) return;
    inputField.value = next;
    // курсор в конец после автоформата (в т.ч. после вставки)
    var pos = next.length;
    try { inputField.setSelectionRange(pos, pos); } catch (e) {}
}

inputField.addEventListener("input", applyNickFormat);
inputField.addEventListener("paste", function () {
    setTimeout(applyNickFormat, 0);
});
inputField.addEventListener("blur", applyNickFormat);

mainButton.onClick(function() {
    applyNickFormat();
    var value = normalizeTagNick(inputField.value);
    inputField.value = value;
    if (!value) return;

    mainButton.showProgress();
    mainButton.disable();
    const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

    fetch("https://amongus0cd.alexeysgrokholskiy.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            is_mini_app_data: true,
            query_id: queryId,
            nick: value,
            user_id: userId,
            chat_id: chatId
        })
    })
    .then(function() {
        tg.close();
    })
    .catch(function() {
        mainButton.hideProgress();
        mainButton.enable();
    });
});
</script>
</html>
